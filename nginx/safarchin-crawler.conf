# ==============================================================================
# Nginx Configuration for Safarchin Travel Crawler API
# Location on server: /etc/nginx/sites-available/safarchin-crawler.conf
# ==============================================================================

# Define upstream service pointing to the containerized FastAPI application
# Replace 8000 with your custom PORT from .env if modified
upstream safarchin_api_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server - Redirects all traffic to HTTPS (with Certbot ACME support)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com; # <-- Replace with your domain or server IP

    # Allow Let's Encrypt HTTP-01 challenge for SSL certificate generation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server - Reverse Proxy with SSL & Performance Tuning
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com; # <-- Replace with your domain

    # SSL Certificate paths (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem; # <-- Update domain
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem; # <-- Update domain

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Max body upload size
    client_max_body_size 20M;

    # Gzip Compression for fast API JSON payloads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Logs
    access_log /var/log/nginx/safarchin_access.log combined;
    error_log /var/log/nginx/safarchin_error.log warn;

    # Main API Routing & Reverse Proxy
    location / {
        proxy_pass http://safarchin_api_backend;
        proxy_http_version 1.1;

        # Keepalive upstream connection
        proxy_set_header Connection "";

        # Preserve client identity for Redis-backed sliding-window rate limiting
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Generous timeouts for live multi-provider crawler aggregation
        # (Allows flights, hotels, and Jajiga scrapers enough time to aggregate in parallel)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Optional: Cache Swagger static docs assets if needed
    location /docs {
        proxy_pass http://safarchin_api_backend/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
